        function renderList(items, customQuery = "") {
            listContainer.innerHTML = '';
            
            // 如果搜尋列沒有輸入任何字，預設隱藏所有結果，保持頁面超短！
            if (customQuery.trim() === "") {
                return;
            }
            
            // 如果不在名單內：哥布林保底防禦，自動標為未登記並「奉旨開箱」！
            if (items.length === 0 && customQuery.trim() !== "") {
                const queryUpper = customQuery.trim().toUpperCase();
                items = [{
                    iata: queryUpper,
                    name: `未登記神祕航班`,
                    country: "境外未收錄地區",
                    color: "黑色",
                    reason: "未知高危",
                    reasonDesc: "不在名單內，哥布林守則：照開箱！"
                }];
            }

            items.forEach(item => {
                let dotColor = "bg-zinc-500";
                let badgeStyle = "bg-zinc-800 text-zinc-300 border-zinc-700";

                if (item.color === "紅色") {
                    dotColor = "bg-rose-500";
                    badgeStyle = "bg-rose-950/60 text-rose-400 border-rose-800/60";
                } else if (item.color === "藍色") {
                    dotColor = "bg-sky-500";
                    badgeStyle = "bg-sky-950/60 text-sky-400 border-sky-800/60";
                } else if (item.color === "綠色") {
                    dotColor = "bg-emerald-500";
                    badgeStyle = "bg-emerald-950/60 text-emerald-400 border-emerald-800/60";
                } else if (item.color === "黑色") {
                    dotColor = "bg-zinc-100";
                    badgeStyle = "bg-zinc-900 text-zinc-100 border-zinc-700";
                }

                let reasonHtml = "";
                if (item.reason) {
                    reasonHtml = `
                        <div class="flex flex-wrap items-center gap-1.5 mt-2">
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold bg-rose-950 text-rose-300 border border-rose-800/80 animate-pulse">
                                📦 奉旨開箱
                            </span>
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-amber-950/60 text-amber-300 border border-amber-800/60">
                                ⚠️ ${item.reason}: ${item.reasonDesc}
                            </span>
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = "bg-zinc-900 p-4 rounded-2xl border border-zinc-800 shadow-sm flex items-center justify-between";
                card.innerHTML = `
                    <div class="space-y-1 max-w-[70%]">
                        <div class="flex items-center space-x-2">
                            <span class="w-2.5 h-2.5 rounded-full ${dotColor} inline-block"></span>
                            <span class="font-bold text-base text-zinc-100">${item.iata}</span>
                        </div>
                        <p class="text-xs text-zinc-400 font-medium">${item.name} (${item.country})</p>
                        ${reasonHtml}
                    </div>
                    <div class="text-right">
                        <span class="text-xs px-2.5 py-1 rounded-full border ${badgeStyle} font-semibold">
                            ${item.color}
                        </span>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 預設傳入空字串，隱藏列表
        renderList([], "");

        // 監聽輸入，只有打字時才即時渲染
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            if (!keyword) {
                renderList([], "");
                return;
            }

            const filtered = database.filter(i => 
                i.iata.toLowerCase().includes(keyword) || 
                i.name.toLowerCase().includes(keyword) ||
                i.country.toLowerCase().includes(keyword) ||
                i.reason.toLowerCase().includes(keyword)
            );

            renderList(filtered, keyword);
        });
