<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查埠破鑊 - 哥布林生存指南</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen pb-10 font-sans">

    <!-- 頂部標題列 (哥布林洞穴風) -->
    <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-10 shadow-md">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">👺</span>
                <div>
                    <h1 class="text-lg font-extrabold tracking-wider text-emerald-400">查埠破鑊</h1>
                    <p class="text-[10px] text-zinc-400">上白下綠·地底社畜求生系統</p>
                </div>
            </div>
            <span id="update-time" class="text-[11px] text-zinc-500 font-mono"></span>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-md mx-auto px-4 mt-4 space-y-4">
        
        <!-- 哥布林自嘲語錄 Banner -->
        <div class="bg-gradient-to-r from-emerald-950 to-zinc-900 border border-emerald-800/50 p-3.5 rounded-2xl shadow-sm text-xs text-emerald-200/90 flex items-center space-x-3">
            <span class="text-2xl">🦠</span>
            <div>
                <p class="font-bold text-emerald-400">底層Factotum生存日常：</p>
                <p class="text-[11px] text-zinc-300 mt-0.5">身穿上白下綠，做盡百般雜務。遇到毒品？老老實實「奉旨開箱」啦！</p>
            </div>
        </div>

        <!-- 搜尋列 -->
        <div>
            <input type="text" id="search-input" placeholder="🔍 輸入 IATA / ICAO 碼或國家/機場名稱..." 
                class="w-full px-4 py-3 bg-zinc-900 border border-zinc-700 rounded-xl text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm">
        </div>

        <!-- 毒品原因說明折疊/提示區 -->
        <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 shadow-sm text-xs space-y-2">
            <p class="font-bold text-emerald-400 text-sm mb-1 flex items-center justify-between">
                <span>📋 毒品代碼解密 (Reason*)</span>
                <span class="text-[10px] bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded border border-emerald-800">見到即開箱</span>
            </p>
            <div class="grid grid-cols-2 gap-1.5 text-zinc-400">
                <div><span class="font-semibold text-emerald-400">CAP:</span> 大麻產地[cite: 1]</div>
                <div><span class="font-semibold text-emerald-400">COP:</span> 可卡因轉運[cite: 1]</div>
                <div><span class="font-semibold text-emerald-400">COT:</span> 可卡因產地[cite: 1]</div>
                <div><span class="font-semibold text-emerald-400">HP:</span> 海洛因產地[cite: 1]</div>
                <div><span class="font-semibold text-emerald-400">HT:</span> 海洛因轉運[cite: 1]</div>
                <div><span class="font-semibold text-emerald-400">MP:</span> MDMA 產地[cite: 1]</div>
                <div><span class="font-semibold text-emerald-400">MT:</span> MDMA 轉運[cite: 1]</div>
                <div><span class="font-semibold text-emerald-400">OP:</span> 鴉片/其他產地[cite: 1]</div>
                <div><span class="font-semibold text-emerald-400">OT:</span> 鴉片類轉運[cite: 1]</div>
            </div>
        </div>

        <!-- 機場列表容器 -->
        <div id="airport-list" class="space-y-3">
            <!-- 數據由 JS 動態載入 -->
        </div>

    </main>

    <script>

        // ==========================================
        const database = [
            // 亞洲

            { iata: "ANK", icao: "LTAD", name: "安卡拉", country: "土耳其", color: "紅色", reason: "", reasonDesc: "" },

            { iata: "BKK", icao: "VTBS", name: "曼谷素凡納布", country: "泰國", color: "紅色", reason: "CAP", reasonDesc: "大麻產地國家[cite: 1]" },
            { iata: "BOM", icao: "VABB", name: "孟買", country: "印度", color: "紅色", reason: "CAP", reasonDesc: "大麻產地國家[cite: 1]" },

            { iata: "CAN", icao: "ZGGG", name: "廣州白雲", country: "中國", color: "藍色", reason: "", reasonDesc: "" },
            { iata: "CCU", icao: "VECC", name: "加爾各答", country: "印度",
