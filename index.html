<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>來港航班機場風險指數</title>
    <!-- 引入 Tailwind CSS 確保設計現代、簡潔 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 支援 PWA / 手機加入主畫面 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-10">

    <!-- 頂部標題列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-slate-900">✈️ 機場來港風險指數</h1>
            <span id="update-time" class="text-xs text-slate-400"></span>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-md mx-auto px-4 mt-4">
        
        <!-- 搜尋列 -->
        <div class="mb-4">
            <input type="text" id="search-input" placeholder="輸入 ICAO 碼或機場名稱搜尋 (例: BKK, VHHH)..." 
                class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
        </div>

        <!-- 機場列表容器 -->
        <div id="airport-list" class="space-y-3">
            <!-- 數據會由 JavaScript 動態載入 -->
        </div>

    </main>

    <script>
        // ==========================================
        // 在這裏輸入你的機場數據（你可以從 Excel 對應填入）
        // ==========================================
        const airportData = [
            { icao: "VTBD", name: "曼谷廊曼 (DMK/VTBD)", risk: "低", score: 15, note: "近期運作正常" },
            { icao: "VTBS", name: "曼谷素凡納布 (BKK/VTBS)", risk: "中", score: 45, note: "留意午後雷雨與航班延誤" },
            { icao: "RCTP", name: "台北桃園 (TPE/RCTP)", risk: "低", score: 20, note: "運作暢順" },
            { icao: "RJTT", name: "東京羽田 (HND/RJTT)", risk: "低", score: 10, note: "安全水平高" },
            { icao: "ZBAA", name: "北京首都 (PEK/ZBAA)", risk: "高", score: 75, note: "受空域管制或天氣影響" }
        ];

        const listContainer = document.getElementById('airport-list');
        const searchInput = document.getElementById('search-input');
        document.getElementById('update-time').innerText = "更新於: " + new Date().toLocaleDateString();

        function renderList(items) {
            listContainer.innerHTML = '';
            if (items.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-10 text-slate-400">搵唔到相關機場數據</div>`;
                return;
            }

            items.forEach(item => {
                // 根據風險級別設定顏色
                let badgeColor = "bg-green-100 text-green-700 border-green-200";
                let scoreColor = "text-green-600";
                if (item.risk === "中") {
                    badgeColor = "bg-amber-100 text-amber-700 border-amber-200";
                    scoreColor = "text-amber-600";
                } else if (item.risk === "高") {
                    badgeColor = "bg-rose-100 text-rose-700 border-rose-200";
                    scoreColor = "text-rose-600";
                }

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-base text-slate-900">${item.icao}</span>
                            <span class="text-xs px-2 py-0.5 rounded-full border ${badgeColor} font-medium">${item.risk}風險</span>
                        </div>
                        <p class="text-sm text-slate-600 mt-0.5">${item.name}</p>
                        <p class="text-xs text-slate-400 mt-1">${item.note}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-2xl font-black ${scoreColor}">${item.score}</span>
                        <span class="block text-[10px] text-slate-400 uppercase tracking-wider">指數</span>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 初始化渲染
        renderList(airportData);

        // 搜尋即時過濾功能
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = airportData.filter(i => 
                i.icao.toLowerCase().includes(keyword) || 
                i.name.toLowerCase().includes(keyword)
            );
            renderList(filtered);
        });
    </script>
</body>
</html>
