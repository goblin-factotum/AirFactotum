            { iata: "KIN", name: "金斯敦", country: "牙買加", color: "綠色", reason: "CAP", reasonDesc: "大麻產地國家" },
            { iata: "LAP", name: "拉巴斯", country: "玻利維亞", color: "綠色", reason: "COP", reasonDesc: "可卡因轉運國家" },
            { iata: "LIM", name: "利馬", country: "秘魯", color: "綠色", reason: "OP", reasonDesc: "鴉片類產地國家" },
            { iata: "MBJ", name: "蒙特哥貝", country: "牙買加", color: "綠色", reason: "CAP", reasonDesc: "大麻產地國家" },
            { iata: "MEX", name: "墨西哥城", country: "墨西哥", color: "綠色", reason: "OP", reasonDesc: "鴉片類產地國家" },
            { iata: "MVD", name: "蒙特維多", country: "烏拉圭", color: "綠色", reason: "", reasonDesc: "" },
            { iata: "PAC", name: "巴拿馬城", country: "巴拿馬", color: "綠色", reason: "", reasonDesc: "" },
            { iata: "PBM", name: "巴拉馬利波", country: "蘇里南", color: "綠色", reason: "", reasonDesc: "" },
            { iata: "PTY", name: "托庫門", country: "巴拿馬", color: "綠色", reason: "", reasonDesc: "" },
            { iata: "POS", name: "西班牙港", country: "特立尼達和多巴哥", color: "綠色", reason: "", reasonDesc: "" },
            { iata: "RIO", name: "里約熱內盧", country: "巴西", color: "綠色", reason: "COT", reasonDesc: "可卡因產地國家" },
            { iata: "SAP", name: "聖佩德羅蘇拉", country: "洪都拉斯", color: "綠色", reason: "", reasonDesc: "" },
            { iata: "SCL", name: "聖地亞哥", country: "智利", color: "綠色", reason: "", reasonDesc: "" },
            { iata: "SRZ", name: "聖克魯斯", country: "玻利維亞", color: "綠色", reason: "COP", reasonDesc: "可卡因轉運國家" },
            { iata: "UIO", name: "基多", country: "厄瓜多爾", color: "綠色", reason: "", reasonDesc: "" }
        ];

        const listContainer = document.getElementById('airport-list');
        const searchInput = document.getElementById('search-input');
        document.getElementById('update-time').innerText = "最後更新: " + new Date().toLocaleDateString();

        function renderList(items, customQuery = "") {
            listContainer.innerHTML = '';
            
            if (customQuery.trim() === "") {
                return;
            }
            
            // 如果不在大數據庫內：保底防禦，自動標為未登記並「問卦」！
            if (items.length === 0 && customQuery.trim() !== "") {
                const queryUpper = customQuery.trim().toUpperCase();
                items = [{
                    iata: queryUpper,
                    name: `未登記航班`,
                    country: "未收錄地區",
                    color: "黑色",
                }];
            }

            items.forEach(item => {
                let dotColor = "bg-slate-400";
                let badgeStyle = "bg-slate-100 text-slate-800 border-slate-300";

                if (item.color === "紅色") {
                    dotColor = "bg-rose-500";
                    badgeStyle = "bg-rose-50 text-rose-700 border-rose-200";
                } else if (item.color === "藍色") {
                    dotColor = "bg-sky-500";
                    badgeStyle = "bg-sky-50 text-sky-700 border-sky-200";
                } else if (item.color === "綠色") {
                    dotColor = "bg-emerald-500";
                    badgeStyle = "bg-emerald-50 text-emerald-800 border-emerald-200";
                } else if (item.color === "黑色") {
                    dotColor = "bg-slate-800";
                    badgeStyle = "bg-slate-900 text-white border-slate-900";
                }

                let reasonHtml = "";
                if (item.reason) {
                    reasonHtml = `
                        <div class="flex flex-wrap items-center gap-1.5 mt-2">
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold bg-rose-100 text-rose-800 border border-rose-300 animate-pulse">
                                📦 奉旨開箱
                            </span>
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-amber-50 text-amber-800 border border-amber-200">
                                ⚠️ ${item.reason}: ${item.reasonDesc}
                            </span>
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between";
                card.innerHTML = `
                    <div class="space-y-1 max-w-[70%]">
                        <div class="flex items-center space-x-2">
                            <span class="w-2.5 h-2.5 rounded-full ${dotColor} inline-block"></span>
                            <span class="font-bold text-base text-slate-900">${item.iata}</span>
                        </div>
                        <p class="text-xs text-slate-600 font-medium">${item.name} (${item.country})</p>
                        ${reasonHtml}
                    </div>
                    <div class="text-right">
                        <span class="text-xs px-2.5 py-1 rounded-full border ${badgeStyle} font-semibold">
                            ${item.color}
                        </span>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        renderList([], "");

        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            if (!keyword) {
                renderList([], "");
                return;
            }

            const filtered = database.filter(i => 
                i.iata.toLowerCase().includes(keyword) || 
                i.name.toLowerCase().includes(keyword) ||
                i.country.toLowerCase().includes(keyword) ||
                i.reason.toLowerCase().includes(keyword)
            );

            renderList(filtered, keyword);
        });
    </script>
</body>
</html>
